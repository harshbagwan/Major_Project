services:
  - type: web
    name: apollo-care-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: '*'
      - key: JWT_SECRET
        generateValue: true
